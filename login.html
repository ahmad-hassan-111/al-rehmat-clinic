<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login | Al-Rehmat Clinic</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Serif+Display&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- The 3 different heartbeat shapes (drawn once, used below) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <path id="ecgA" d="M0 60 h90 q16 -14 32 0 h26 l10 7 l16 -52 l16 86 l12 -41 h28 q26 -22 52 0 h92 h130 l6 12 l10 -64 l10 76 l6 -24 h138 h110 l8 -50 l8 50 h14 l8 -38 l8 38 h24 q16 -12 32 0 h98 h100 q22 -16 44 0 h30 l12 10 l22 -60 l24 100 l16 -50 h30 q40 -40 80 0 h72 h100 q14 14 28 0 h28 l8 -6 l12 50 l12 -44 h34 q26 26 52 0 h98 h80 l10 -40 l10 70 l10 -60 l10 80 l10 -50 h50 q20 -16 40 0 h74 h90 q14 -12 28 0 h30 l12 -46 q28 -10 56 0 l12 46 h40 q30 -22 60 0 h46 h300"/>
      <path id="ecgB" d="M0 60 h120 q20 -12 40 0 h60 q18 -10 36 0 h90 l10 6 l14 -44 l14 78 l10 -40 h60 q30 -26 60 0 h140 q16 -10 32 0 h70 q16 -10 32 0 h120 l8 -30 l8 30 h40 q22 -18 44 0 h160 l12 8 l20 -70 l20 112 l14 -50 h40 q36 -36 72 0 h130 q20 -12 40 0 h90 l8 -22 l8 22 h20 l8 -22 l8 22 h60 q26 -22 52 0 h300"/>
      <path id="ecgC" d="M0 60 h40 l8 -26 l10 52 l8 -26 h60 l8 -40 l10 70 l8 -30 h30 q14 -14 28 0 h90 l6 -18 l8 36 l6 -18 h20 l8 -50 l12 90 l10 -40 h120 q18 -14 36 0 h50 l8 -34 l10 60 l8 -26 h24 l8 -34 l10 60 l8 -26 h100 q24 -20 48 0 h70 l12 -56 l14 100 l10 -44 h60 q16 -12 32 0 h40 l8 -24 l8 40 l6 -16 h130 l10 -46 l12 78 l10 -32 h50 q20 -14 40 0 h300"/>
    </defs>
  </svg>

  <main class="login">

    <!-- LEFT: name, heartbeat lines, headline -->
    <section class="login__brand">

      <a href="index.html" class="logo" aria-label="Al-Rehmat Clinic, back to website">
        <span class="logo__name">AL-REHMAT<span class="logo__moon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9.82 2.24A10 10 0 1 0 21.76 14.18A8.5 8.5 0 0 1 9.82 2.24Z"/></svg></span></span>
        <span class="logo__tag">CLINIC</span>
      </a>

            <div class="monitor" aria-hidden="true">
        <div class="ecg">
          <svg class="ecg__line ecg__line--base" viewBox="0 0 2400 120" preserveAspectRatio="xMidYMid slice"><use href="#ecgA"/></svg>
          <svg class="ecg__line ecg__line--glow" viewBox="0 0 2400 120" preserveAspectRatio="xMidYMid slice"><use href="#ecgA"/></svg>
        </div>
      </div>
      <div class="login__tagline">
        <h2 class="login__tagline-title">Every appointment, handled with care.</h2>
        <p class="login__tagline-text">Sign in to view and manage your patients' appointments.</p>
      </div>

    </section>

    <!-- RIGHT: the login form -->
    <section class="login__panel">
      <div class="login__box">
        <h1 class="login__title">Welcome back</h1>
        <p class="login__lead">Sign in to manage appointments.</p>

        <form class="login__form" id="loginForm">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="username">
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="field__password">
              <input type="password" id="password" name="password" required autocomplete="current-password">
              <button type="button" class="field__toggle" id="togglePassword" aria-label="Show password" aria-pressed="false">
                <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>

          <p class="login__error" id="loginError" role="alert"></p>

          <button type="submit" class="btn" id="loginBtn">Sign in</button>
        </form>

        <a class="login__back" href="index.html">&larr; Back to website</a>
      </div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
